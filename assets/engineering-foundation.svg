<text x="116" y="334" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#a8d7d4" text-anchor="start">INTENDED END GOAL</text>
<text x="116" y="393" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="600" fill="#ffffff" text-anchor="start">An organization that can explain its decisions,</text>
<text x="116" y="444" font-family="Segoe UI, Arial, sans-serif" font-size="43" font-weight="600" fill="#ffffff" text-anchor="start">coordinate work and learn from results.</text>
<text x="190" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#506778" text-anchor="start">CAPABILITY LAYERS</text>
<text x="1015" y="498" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#12696c" text-anchor="start">UNLOCKS</text>
<rect x="80" y="510" width="88" height="948" rx="20" fill="#12696c"/>
<text x="124" y="553" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#ffffff" text-anchor="middle">ALL</text>
<text x="124" y="580" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff" text-anchor="middle">LAYERS</text>
