<path d="M1501 580H1540Q1553 580 1553 594V1363Q1553 1380 1537 1380H1508" fill="none" stroke="#12696c" stroke-width="3" marker-end="url(#arrow)"/>
<text transform="translate(1583 981) rotate(90)" font-family="Segoe UI, Arial, sans-serif" font-size="23" fill="#12696c" text-anchor="middle">Reviewed outcomes become new evidence</text>
<rect x="80" y="1510" width="1440" height="270" rx="24" fill="#fff0d9" stroke="#ecd6b6"/>
<text x="116" y="1565" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#88551a" text-anchor="start">THE HANDOFF LINE</text>
<text x="116" y="1626" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="600" fill="#12293c" text-anchor="start">Other teams depend on this staying current,</text>
<text x="116" y="1673" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="600" fill="#12293c" text-anchor="start">permission-correct and traceable.</text>
<text x="116" y="1723" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#183448" text-anchor="start">If the current setup cannot sustain that, move context maintenance to a managed product.</text>
<text x="116" y="1758" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#183448" text-anchor="start">Company engineers retain engineering decisions and approval authority.</text>
<text x="80" y="1838" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="600" fill="#12293c" text-anchor="start">Start now: approved records → one question → human review.</text>
<text x="80" y="1881" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="400" fill="#506778" text-anchor="start">Graphs, RAG and MCP are optional methods. Controls apply from the first pilot.</text>
<text x="80" y="1939" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#183448" text-anchor="start">Engineering Context Toolkit  /  A capability roadmap, not a single-product stack.</text>
<text x="80" y="1974" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="400" fill="#506778" text-anchor="start">Local tools and examples support selected steps; shared services require company integration.</text>
</svg>
