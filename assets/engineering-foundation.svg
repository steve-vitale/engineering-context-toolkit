<text x="234" y="1368" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#12293c" text-anchor="middle">1</text>
<text x="280" y="1365" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#183448" text-anchor="start">Controlled sources &amp; observations</text>
<text x="280" y="1408" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Drawings, procedures, manuals and data</text>
<text x="280" y="1441" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Originals, revisions and source locations</text>
