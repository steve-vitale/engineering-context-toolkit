<text x="1015" y="1065" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#12696c" text-anchor="start">Preserve reasoning and</text>
<text x="1015" y="1106" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#12696c" text-anchor="start">responsibility</text>
<rect x="190" y="1150" width="1310" height="148" rx="20" fill="#ffffff" stroke="#dde6ed"/>
<rect x="212" y="1173" width="44" height="44" rx="12" fill="#e8f0f5"/>
<text x="234" y="1208" font-family="Segoe UI, Arial, sans-serif" font-size="29" font-weight="600" fill="#12293c" text-anchor="middle">2</text>
<text x="280" y="1205" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#183448" text-anchor="start">Shared engineering meaning</text>
