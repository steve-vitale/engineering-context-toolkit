<text x="76" y="184" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="600" fill="#12293c" text-anchor="start">modern engineering</text>
<text x="80" y="242" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="400" fill="#506778" text-anchor="start">What each capability unlocks — and when the work needs a managed home.</text>
