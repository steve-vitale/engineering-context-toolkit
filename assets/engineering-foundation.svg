<text x="280" y="565" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#183448" text-anchor="start">Execution evidence &amp; learning</text>
<text x="280" y="608" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Recorded execution + qualified observations</text>
<text x="280" y="641" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Review effects before sharing lessons</text>
