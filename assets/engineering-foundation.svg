<text x="280" y="1045" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#183448" text-anchor="start">Maintained context &amp; decisions</text>
<text x="280" y="1088" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Claims, decisions, owners and history</text>
<text x="280" y="1121" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="400" fill="#506778" text-anchor="start">Versioned sources and dependencies</text>
