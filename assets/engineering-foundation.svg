<text x="1015" y="905" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="600" fill="#12696c" text-anchor="start">Find relevant evidence</text>
<rect x="190" y="990" width="1310" height="148" rx="20" fill="#ffffff" stroke="#dde6ed"/>
<rect x="212" y="1013" width="44" height="44" rx="12" fill="#e8f0f5"/>
