<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
<title id="title">Engineering foundations: what each capability unlocks and when to hand over service operations</title>
<desc id="desc">Six capability layers rise from controlled sources, shared meaning and maintained context to authorized retrieval, engineer-reviewed workflows and outcome learning. Ownership, permissions, provenance, uncertainty and validation span every layer. Handoff occurs when other teams rely on current, permission-correct, traceable context and the existing arrangement cannot sustain it. Manual source-question-review work can start early. This is a conceptual roadmap, not a claim that every capability is implemented.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#12696c"/></marker></defs>
